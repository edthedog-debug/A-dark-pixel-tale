<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dark Pixel Tale - The Skull & The Hare</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030305;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: 'Press Start 2P', monospace;

    cursor: none;
}

#game-container {

    position: relative;

    width: min(96vw, 1100px);

    aspect-ratio: 16 / 10;

    overflow: hidden;

    background: #05050a;

    border: 4px solid #292930;

    box-shadow:
        0 0 0 2px #000,
        0 0 45px rgba(180,0,0,.18);

}

canvas {

    display: block;

    width: 100%;
    height: 100%;

    image-rendering: pixelated;
    image-rendering: crisp-edges;

}

/* =========================================================
   TITLE SCREEN
========================================================= */

#title-screen {

    position: absolute;

    inset: 0;

    z-index: 50;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            rgba(70,0,0,.3),
            rgba(0,0,0,.98) 70%
        );

}

#title-screen h1 {

    color: #d90000;

    font-size: clamp(18px, 3vw, 34px);

    line-height: 1.7;

    text-shadow:
        3px 3px 0 #260000,
        0 0 15px #ff0000,
        0 0 40px rgba(255,0,0,.7);

    animation: titlePulse 3s infinite;

}

.subtitle {

    margin-top: 20px;

    color: #555;

    font-size: 8px;

    letter-spacing: 3px;

}

.start {

    margin-top: 45px;

    color: #ddd;

    font-size: 11px;

    animation: blink 1s steps(2) infinite;

}

.hint {

    margin-top: 25px;

    color: #333;

    font-size: 7px;

}

/* =========================================================
   STORY TEXT
========================================================= */

#story-box {

    position: absolute;

    left: 6%;
    right: 6%;

    bottom: 8px;

    min-height: 48px;

    padding:
        8px
        18px;

    background:
        linear-gradient(
            rgba(0,0,0,.88),
            rgba(5,5,8,.94)
        );

    border-top:
        2px solid rgba(180,180,180,.18);

    border-bottom:
        2px solid rgba(180,180,180,.08);

    box-shadow:
        0 -8px 25px rgba(0,0,0,.65);

    z-index: 25;

    pointer-events: none;

}

#story-text {

    color: #ddd;

    text-align: center;

    font-size: clamp(6px, .85vw, 10px);

    line-height: 1.65;

    min-height: 22px;

    text-shadow:
        2px 2px #000;

}

#scene-counter {

    position: absolute;

    top: 8px;
    left: 10px;

    z-index: 30;

    color: #555;

    font-size: 6px;

}

/* =========================================================
   MORAL
========================================================= */

#moral {

    position: absolute;

    inset: 0;

    z-index: 60;

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            rgba(70,0,0,.35),
            rgba(0,0,0,.98)
        );

    color: #e00000;

    font-size: clamp(9px, 1.4vw, 16px);

    line-height: 2;

    text-shadow:
        0 0 12px #ff0000,
        0 0 30px #600;

}

.restart {

    margin-top: 35px;

    color: #666;

    font-size: 8px;

    animation: blink 1.2s steps(2) infinite;

}

@keyframes blink {

    0%,45% {
        opacity: 1;
    }

    46%,100% {
        opacity: 0;
    }

}

@keyframes titlePulse {

    0%,100% {
        transform: scale(1);
        filter: brightness(1);
    }

    50% {
        transform: scale(1.03);
        filter: brightness(1.4);
    }

}

</style>
</head>

<body>

<div id="game-container">

<canvas id="gameCanvas"></canvas>

<div id="scene-counter">
SCENE 01
</div>

<div id="story-box">

<div id="story-text">
Loading...
</div>

</div>

<div id="moral">

<div>

MORAL OF THE STORY:

<br><br>

DON'T TRUST EVEN YOURSELF.

<br>

THE DARKNESS LIES WITHIN US ALL.

</div>

<div class="restart">
CLICK TO RESTART
</div>

</div>

<div id="title-screen">

<h1>
DARK PIXEL TALE
<br>
THE SKULL & THE HARE
</h1>

<div class="subtitle">
A DARK FAIRY TALE
</div>

<div class="start">
CLICK TO BEGIN
</div>

<div class="hint">
A CINEMATIC PIXEL STORY
</div>

</div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");

canvas.width = 960;
canvas.height = 600;

ctx.imageSmoothingEnabled = false;


/* =========================================================
   DOM
========================================================= */

const titleScreen =
document.getElementById("title-screen");

const storyText =
document.getElementById("story-text");

const sceneCounter =
document.getElementById("scene-counter");

const moral =
document.getElementById("moral");


/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;

let sceneIndex = 0;

let sceneTimer = 0;

let lastTime = 0;

let cameraX = 0;

let cameraTargetX = 0;

let cameraZoom = 1;

let cameraTargetZoom = 1;

let cameraY = 0;

let cameraTargetY = 0;

let fade = 1;

let screenShake = 0;

let hareKilled = false;

let moralShown = false;

let cinematicFlash = 0;


/* =========================================================
   CHARACTERS
========================================================= */

const skull = {

    x: 90,

    y: 390,

    walkFrame: 0,

    walkTimer: 0,

    jump: 0,

    attack: 0,

    breathing: 0

};

const hare = {

    x: 110,

    y: 390,

    walkFrame: 0,

    walkTimer: 0,

    sleeping: false,

    headless: false,

    breathing: 0

};


/* =========================================================
   PARTICLES
========================================================= */

const particles = [];


function particle(
    x,
    y,
    type = "dust"
) {

    particles.push({

        x,
        y,

        vx:
            (Math.random()-.5) *
            (type === "blood" ? 3 : 1.2),

        vy:
            type === "blood"
                ? -Math.random()*3-.5
                : -Math.random()*.7,

        life: 1,

        size:
            Math.random() < .7
                ? 2
                : 3,

        type

    });

}


function updateParticles(dt) {

    for (
        let i = particles.length-1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        if (
            p.type === "blood"
        ) {

            p.vy +=
                .05 * dt;

        } else {

            p.vy +=
                .01 * dt;

        }

        p.life -=
            .012 * dt;

        if (
            p.life <= 0
        ) {

            particles.splice(i,1);

        }

    }

}


function drawParticles() {

    for (
        const p of particles
    ) {

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            p.type === "blood"
                ? "#a80000"
                : "#57515b";

        ctx.fillRect(
            Math.floor(p.x-cameraX),
            Math.floor(p.y),
            p.size,
            p.size
        );

    }

    ctx.globalAlpha = 1;

}


/* =========================================================
   PIXEL HELPERS
========================================================= */

function rect(
    x,
    y,
    w,
    h,
    color
) {

    ctx.fillStyle = color;

    ctx.fillRect(
        Math.floor(x),
        Math.floor(y),
        Math.floor(w),
        Math.floor(h)
    );

}


function circle(
    x,
    y,
    r,
    color
) {

    ctx.fillStyle = color;

    for (
        let yy=-r;
        yy<=r;
        yy+=3
    ) {

        for (
            let xx=-r;
            xx<=r;
            xx+=3
        ) {

            if (
                xx*xx +
                yy*yy <=
                r*r
            ) {

                rect(
                    x+xx,
                    y+yy,
                    3,
                    3,
                    color
                );

            }

        }

    }

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawSky() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    gradient.addColorStop(
        0,
        "#02020b"
    );

    gradient.addColorStop(
        .45,
        "#0d1025"
    );

    gradient.addColorStop(
        1,
        "#20151d"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =========================================================
   STARS
========================================================= */

function drawStars() {

    for (
        let i=0;
        i<100;
        i++
    ) {

        let x =
            (i*173)
            -
            cameraX*.05;

        x =
            ((x%1100)+1100)%1100;

        const y =
            (i*71)%270;

        rect(
            x,
            y,
            i%8===0 ? 2 : 1,
            i%8===0 ? 2 : 1,
            i%9===0
                ? "#777"
                : "#3e3e4c"
        );

    }

}


/* =========================================================
   MOON
========================================================= */

function drawMoon() {

    const x =
        780 -
        cameraX*.04;

    const y = 100;

    const glow =
        ctx.createRadialGradient(
            x,
            y,
            20,
            x,
            y,
            140
        );

    glow.addColorStop(
        0,
        "rgba(170,0,0,.28)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        140,
        0,
        Math.PI*2
    );

    ctx.fill();

    circle(
        x,
        y,
        43,
        "#8b2e32"
    );

    circle(
        x-8,
        y-5,
        38,
        "#a43b3b"
    );

    rect(
        x-20,
        y-13,
        10,
        6,
        "#712528"
    );

    rect(
        x+12,
        y+13,
        8,
        7,
        "#712528"
    );

    rect(
        x+19,
        y-20,
        6,
        6,
        "#712528"
    );

}


/* =========================================================
   MOUNTAINS
========================================================= */

function drawMountains() {

    ctx.fillStyle =
        "#090914";

    ctx.beginPath();

    ctx.moveTo(
        0,
        370
    );

    for (
        let x=0;
        x<=canvas.width;
        x+=60
    ) {

        const h =
            70 +
            Math.sin(x*.02)*45 +
            Math.sin(x*.05)*25;

        ctx.lineTo(
            x,
            370-h
        );

    }

    ctx.lineTo(
        canvas.width,
        canvas.height
    );

    ctx.lineTo(
        0,
        canvas.height
    );

    ctx.fill();

}


/* =========================================================
   TREES
========================================================= */

function tree(
    worldX,
    scale,
    layer
) {

    const x =
        worldX -
        cameraX *
        layer;

    const y = 405;

    rect(
        x-9*scale,
        y-190*scale,
        18*scale,
        190*scale,
        "#171218"
    );

    rect(
        x-55*scale,
        y-150*scale,
        110*scale,
        9*scale,
        "#141017"
    );

    rect(
        x-42*scale,
        y-115*scale,
        84*scale,
        8*scale,
        "#141017"
    );

    circle(
        x,
        y-205*scale,
        60*scale,
        "#09090f"
    );

    circle(
        x-40*scale,
        y-175*scale,
        40*scale,
        "#0b0a10"
    );

    circle(
        x+40*scale,
        y-170*scale,
        45*scale,
        "#0b0a10"
    );

}


function drawTrees() {

    for (
        let i=0;
        i<14;
        i++
    ) {

        tree(
            i*110+20,
            .7,
            .35
        );

    }

    for (
        let i=0;
        i<12;
        i++
    ) {

        tree(
            i*130+70,
            1,
            .55
        );

    }

}


/* =========================================================
   GROUND
========================================================= */

function drawGround() {

    rect(
        0,
        400,
        canvas.width,
        200,
        "#111015"
    );

    for (
        let i=0;
        i<130;
        i++
    ) {

        let x =
            i*83 -
            cameraX*.75;

        x =
            ((x%1050)+1050)%1050;

        const y =
            415 +
            (i*37)%170;

        rect(
            x,
            y,
            i%5===0 ? 5 : 2,
            2,
            i%3===0
                ? "#2b252d"
                : "#1e1b21"
        );

    }

}


/* =========================================================
   GRAVESTONES
========================================================= */

function gravestone(
    worldX,
    size=1
) {

    const x =
        worldX -
        cameraX*.8;

    const y = 430;

    rect(
        x-17*size,
        y-35*size,
        34*size,
        35*size,
        "#38343d"
    );

    circle(
        x,
        y-35*size,
        17*size,
        "#38343d"
    );

    rect(
        x-11*size,
        y-18*size,
        22*size,
        3*size,
        "#211e25"
    );

    rect(
        x-3*size,
        y-28*size,
        6*size,
        18*size,
        "#211e25"
    );

}


function drawGraveyard() {

    for (
        let i=0;
        i<12;
        i++
    ) {

        gravestone(
            i*115+40,
            .7+(i%3)*.12
        );

    }

}


/* =========================================================
   BONE BRIDGE
========================================================= */

function drawBoneBridge() {

    const start =
        300 -
        cameraX;

    for (
        let i=0;
        i<18;
        i++
    ) {

        const x =
            start+i*30;

        const wobble =
            Math.sin(
                performance.now()*.003+i
            )*2;

        rect(
            x,
            390+wobble,
            25,
            9,
            "#bcb09b"
        );

        circle(
            x+25,
            394+wobble,
            7,
            "#d1c3a7"
        );

        rect(
            x+8,
            400,
            4,
            50,
            "#655d52"
        );

        rect(
            x+19,
            400,
            4,
            50,
            "#655d52"
        );

    }

}


/* =========================================================
   FINISH LINE
========================================================= */

function finishLine() {

    const x =
        820-cameraX;

    rect(
        x,
        300,
        5,
        120,
        "#d4d4d4"
    );

    for (
        let i=0;
        i<8;
        i++
    ) {

        rect(
            x+5,
            305+i*13,
            30,
            13,
            i%2===0
                ? "#eee"
                : "#8d0000"
        );

    }

}


/* =========================================================
   SPIRIT
========================================================= */

function spirit() {

    const x =
        660-cameraX;

    const y = 285;

    const pulse =
        Math.sin(
            performance.now()*.004
        )*5;

    const glow =
        ctx.createRadialGradient(
            x,
            y,
            5,
            x,
            y,
            110
        );

    glow.addColorStop(
        0,
        "rgba(110,0,150,.3)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        110,
        0,
        Math.PI*2
    );

    ctx.fill();

    circle(
        x,
        y+pulse,
        25,
        "#30223d"
    );

    rect(
        x-23,
        y+10,
        46,
        45,
        "#24192c"
    );

    rect(
        x-13,
        y-4,
        8,
        5,
        "#c000ff"
    );

    rect(
        x+5,
        y-4,
        8,
        5,
        "#c000ff"
    );

    rect(
        x-50,
        y+15,
        27,
        5,
        "#3d284b"
    );

    rect(
        x+23,
        y+15,
        27,
        5,
        "#3d284b"
    );

}


/* =========================================================
   SKULL
========================================================= */

function drawSkull() {

    let x =
        skull.x-cameraX;

    let y =
        skull.y-skull.jump;

    x =
        (x-480) *
        cameraZoom +
        480;

    y =
        (y-350) *
        cameraZoom +
        350;

    ctx.save();

    /* Shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.55)";

    ctx.fillRect(
        x-10,
        y+47,
        55,
        7
    );

    /* Cloak */

    rect(
        x-6,
        y+5,
        43,
        50,
        "#2a2933"
    );

    rect(
        x-11,
        y+18,
        53,
        36,
        "#1e1e27"
    );

    /* Hood */

    rect(
        x-8,
        y-10,
        46,
        18,
        "#353540"
    );

    circle(
        x+15,
        y-3,
        25,
        "#353540"
    );

    /* Face shadow */

    rect(
        x-1,
        y+1,
        34,
        8,
        "#16161d"
    );

    /* Skull */

    rect(
        x+1,
        y+2,
        31,
        32,
        "#cbc8bc"
    );

    rect(
        x+5,
        y+4,
        23,
        3,
        "#f0ede0"
    );

    /* Eyes */

    rect(
        x+6,
        y+11,
        8,
        8,
        "#050506"
    );

    rect(
        x+19,
        y+11,
        8,
        8,
        "#050506"
    );

    rect(
        x+8,
        y+13,
        4,
        3,
        "#ff0000"
    );

    rect(
        x+21,
        y+13,
        4,
        3,
        "#ff0000"
    );

    /* Nose */

    rect(
        x+14,
        y+19,
        6,
        5,
        "#25242a"
    );

    /* Jaw */

    rect(
        x+5,
        y+25,
        24,
        9,
        "#d8d5c9"
    );

    /* Teeth */

    for (
        let i=0;
        i<5;
        i++
    ) {

        rect(
            x+8+i*4,
            y+26,
            3,
            6,
            "#27262b"
        );

    }

    /* Arms */

    const swing =
        skull.walkFrame
            ? 3
            : -3;

    rect(
        x-12,
        y+29+swing,
        10,
        25,
        "#25242e"
    );

    rect(
        x+34,
        y+29-swing,
        10,
        25,
        "#25242e"
    );

    /* Sword */

    if (
        skull.attack > 0
    ) {

        ctx.save();

        ctx.translate(
            x+37,
            y+33
        );

        ctx.rotate(
            -1.25+
            skull.attack
        );

        rect(
            0,
            0,
            7,
            68,
            "#bfc4c9"
        );

        rect(
            0,
            0,
            3,
            68,
            "#ffffff"
        );

        rect(
            -4,
            62,
            15,
            6,
            "#614c35"
        );

        ctx.restore();

    }

    ctx.restore();

}


/* =========================================================
   HARE
========================================================= */

function drawHare() {

    let x =
        hare.x-cameraX;

    let y =
        hare.y;

    ctx.save();

    /* Shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.45)";

    ctx.fillRect(
        x-5,
        y+48,
        52,
        7
    );

    /* Body */

    rect(
        x,
        y+14,
        38,
        32,
        "#81472d"
    );

    rect(
        x+5,
        y+19,
        29,
        20,
        "#9d5835"
    );

    if (
        !hare.headless
    ) {

        /* Head */

        rect(
            x+4,
            y-5,
            31,
            25,
            "#a65d38"
        );

        /* Ears */

        rect(
            x+5,
            y-34,
            8,
            31,
            "#82462e"
        );

        rect(
            x+25,
            y-37,
            8,
            34,
            "#82462e"
        );

        rect(
            x+8,
            y-29,
            3,
            21,
            "#d78982"
        );

        rect(
            x+28,
            y-32,
            3,
            22,
            "#d78982"
        );

        /* Eyes */

        rect(
            x+9,
            y+3,
            7,
            7,
            "#080808"
        );

        rect(
            x+24,
            y+3,
            7,
            7,
            "#080808"
        );

        rect(
            x+11,
            y+5,
            3,
            2,
            "#fff0f0"
        );

        rect(
            x+26,
            y+5,
            3,
            2,
            "#fff0f0"
        );

        /* Nose */

        rect(
            x+17,
            y+13,
            7,
            4,
            "#e07171"
        );

        /* Mouth */

        rect(
            x+17,
            y+17,
            8,
            2,
            "#48211e"
        );

    } else {

        rect(
            x+7,
            y-5,
            27,
            12,
            "#680000"
        );

        rect(
            x+11,
            y+1,
            18,
            6,
            "#c00000"
        );

    }

    /* Tail */

    circle(
        x+40,
        y+22,
        9,
        "#d8d3ca"
    );

    /* Legs */

    const leg =
        hare.walkFrame
            ? 3
            : -3;

    rect(
        x+5,
        y+40+leg,
        9,
        14,
        "#703d29"
    );

    rect(
        x+25,
        y+40-leg,
        9,
        14,
        "#703d29"
    );

    ctx.restore();

}


/* =========================================================
   WORLD
========================================================= */

function drawWorld() {

    drawSky();

    drawStars();

    drawMoon();

    drawMountains();

    drawTrees();

    drawGround();

    drawGraveyard();

    if (
        sceneIndex >= 11
    ) {
        drawBoneBridge();
    }

    if (
        sceneIndex >= 13
    ) {
        finishLine();
    }

    if (
        sceneIndex === 6 ||
        sceneIndex === 7
    ) {
        spirit();
    }

}


/* =========================================================
   CINEMATIC CAMERA
========================================================= */

function updateCamera(dt) {

    cameraX +=
        (cameraTargetX-cameraX)
        * .035
        * dt;

    cameraZoom +=
        (cameraTargetZoom-cameraZoom)
        * .04
        * dt;

    cameraY +=
        (cameraTargetY-cameraY)
        * .04
        * dt;

    if (
        screenShake > 0
    ) {

        cameraX +=
            (Math.random()-.5)
            * screenShake;

        cameraY +=
            (Math.random()-.5)
            * screenShake;

        screenShake *= .82;

    }

}


/* =========================================================
   CAMERA PRESETS
========================================================= */

function setCamera(
    x,
    zoom,
    y=0
) {

    cameraTargetX = x;

    cameraTargetZoom = zoom;

    cameraTargetY = y;

}


/* =========================================================
   STORY
========================================================= */

const scenes = [

{

duration: 5
},

{

duration: 5
},

{

duration: 5
},

duration: 5
},

text:

duration: 6
},

{
text:
"The hare encounters a dark spirit offering power.",
duration: 6
},

{
text:
"Hare: 'I don't need your power, I'm winning!'",
duration: 6
},

{
text:
"The skull finds a cursed shortcut through the graveyard.",

},

{
text:
"The hare meets other hares who doubt the skull.",
duration: 6
},

{
text:
"Other hares: 'You're racing a skull? How odd!'",

},

{

"The skull crosses a bridge of bones.",

},

{
text:

{

];


/* =========================================================
   START SCENE
========================================================= */

function startScene(index) {

    sceneIndex =
        index;

    sceneTimer = 0;

    fade = 1;

    skull.attack = 0;

    storyText.textContent =
        scenes[index].text;

    sceneCounter.textContent =
        `SCENE ${String(index+1).padStart(2,"0")}`;


    switch(index) {

        /* ---------------------------------------------
           INTRO
        --------------------------------------------- */

        case 0:

            setCamera(
                0,
                1
            );

            break;


        /* ---------------------------------------------
           MEETING
        --------------------------------------------- */

        case 1:

            setCamera(
                70,
                1.35
            );

            skull.x = 210;
            hare.x = 290;

            break;


        /* ---------------------------------------------
           CHALLENGE
        --------------------------------------------- */

        case 2:

            setCamera(
                170,
                1.55,
                -10
            );

            break;


        /* ---------------------------------------------
           ACCEPT
        --------------------------------------------- */

        case 3:

            setCamera(
                170,
                1.45
            );

            break;


        /* ---------------------------------------------
           RACE
        --------------------------------------------- */

        case 4:

            hare.sleeping = false;

            hare.x = 320;

            skull.x = 170;

            hare.targetX = 720;

            skull.targetX = 500;

            setCamera(
                180,
                1
            );

            break;


        /* ---------------------------------------------
           SLOW SKULL
        --------------------------------------------- */

        case 5:

            skull.targetX = 520;

            setCamera(
                280,
                1.15
            );

            break;


        /* ---------------------------------------------
           SPIRIT
        --------------------------------------------- */

        case 6:

            setCamera(
                430,
                1.55
            );

            break;


        case 7:

            setCamera(
                430,
                1.8
            );

            break;


        /* ---------------------------------------------
           GRAVEYARD
        --------------------------------------------- */

        case 8:

            skull.targetX = 570;

            setCamera(
                380,
                1.1
            );

            break;


        /* ---------------------------------------------
           HARES
        --------------------------------------------- */

        case 9:

            setCamera(
                500,
                1.25
            );

            break;


        case 10:

            setCamera(
                540,
                1.5
            );

            break;


        /* ---------------------------------------------
           BONE BRIDGE
        --------------------------------------------- */

        case 11:

            skull.targetX = 650;

            setCamera(
                420,
                1.1
            );

            break;


        case 12:

            setCamera(
                500,
                1.4
            );

            break;


        /* ---------------------------------------------
           FINISH
        --------------------------------------------- */

        case 13:

            hare.x = 720;

            skull.x = 550;

            hare.sleeping = false;

            setCamera(
                560,
                1.3
            );

            break;


        case 14:

            hare.sleeping = true;

            setCamera(
                600,
                1.55
            );

            break;


        case 15:

            hare.sleeping = true;

            setCamera(
                630,
                1.7
            );

            break;


        /* ---------------------------------------------
           APPROACH
        --------------------------------------------- */

        case 16:

            skull.targetX =
                hare.x-70;

            setCamera(
                610,
                1.45
            );

            break;


        /* ---------------------------------------------
           REALIZATION
        --------------------------------------------- */

        case 17:

            setCamera(
                650,
                1.75
            );

            break;


        /* ---------------------------------------------
           DECISION
        --------------------------------------------- */

        case 18:

            setCamera(
                650,
                1.95,
                -10
            );

            break;


        /* ---------------------------------------------
           KILL
        --------------------------------------------- */

        case 19:

            skull.targetX =
                hare.x-25;

            setCamera(
                650,
                2.25
            );

            break;


        /* ---------------------------------------------
           VICTORY
        --------------------------------------------- */

        case 20:

            setCamera(
                620,
                1.5,
                -15
            );

            break;

    }

}


/* =========================================================
   CHARACTER UPDATE
========================================================= */

function updateCharacters(dt) {

    /* Skull walking */

    if (
        Math.abs(
            skull.targetX-
            skull.x
        ) > 2
        &&
        sceneIndex !== 19
    ) {

        const direction =
            skull.targetX >
            skull.x
                ? 1
                : -1;

        skull.x +=
            direction*
            .45*
            dt;

        skull.walkTimer += dt;

        if (
            skull.walkTimer>8
        ) {

            skull.walkTimer=0;

            skull.walkFrame =
                1-skull.walkFrame;

        }

        if (
            Math.random()<.025
        ) {

            particle(
                skull.x+15,
                skull.y+50
            );

        }

    }


    /* Hare running */

    if (
        !hare.sleeping &&
        Math.abs(
            hare.targetX-
            hare.x
        )>2
    ) {

        const direction =
            hare.targetX>
            hare.x
                ? 1
                : -1;

        hare.x +=
            direction*
            .9*
            dt;

        hare.walkTimer += dt;

        if (
            hare.walkTimer>6
        ) {

            hare.walkTimer=0;

            hare.walkFrame =
                1-hare.walkFrame;

        }

        if (
            Math.random()<.05
        ) {

            particle(
                hare.x+15,
                hare.y+48
            );

        }

    }


    /* Sleeping breathing */

    if (
        hare.sleeping
    ) {

        hare.y =
            390+
            Math.sin(
                performance.now()*.003
            )*1.5;

    }


    /* Victory */

    if (
        sceneIndex===20
    ) {

        skull.jump =
            Math.abs(
                Math.sin(
                    performance.now()*.005
                )
            )*65;

    }


    /* Attack sequence */

    if (
        sceneIndex===19
    ) {

        const progress =
            Math.min(
                sceneTimer/
                2.5,
                1
            );

        skull.attack =
            progress*
            1.8;

        if (
            progress>.45 &&
            !hareKilled
        ) {

            hareKilled=true;

            hare.headless=true;

            cinematicFlash=.9;

            screenShake=16;

            for(
                let i=0;
                i<35;
                i++
            ) {

                particle(
                    hare.x+20,
                    hare.y+5,
                    "blood"
                );

            }

        }

    }

}


/* =========================================================
   CINEMATIC EFFECTS
========================================================= */

function cinematicEffects(dt) {

    if (
        cinematicFlash>0
    ) {

        cinematicFlash -=
            .045*dt;

        if (
            cinematicFlash<0
        ) {

            cinematicFlash=0;

        }

    }

    if (
        fade>0
    ) {

        fade -=
            .04*dt;

        if (
            fade<0
        ) {

            fade=0;

        }

    }

}


/* =========================================================
   DRAW FRAME
========================================================= */

function drawFrame() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        0,
        cameraY
    );

    drawWorld();

    drawSkull();

    drawHare();

    drawParticles();

    ctx.restore();


    /* ---------------------------------------------
       Cinematic vignette
    --------------------------------------------- */

    const vignette =
        ctx.createRadialGradient(
            480,
            300,
            170,
            480,
            300,
            560
        );

    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        "rgba(0,0,0,.75)"
    );

    ctx.fillStyle =
        vignette;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* ---------------------------------------------
       Letterbox
    --------------------------------------------- */

    rect(
        0,
        0,
        canvas.width,
        22,
        "#030305"
    );

    rect(
        0,
        canvas.height-22,
        canvas.width,
        22,
        "#030305"
    );


    /* ---------------------------------------------
       Attack flash
    --------------------------------------------- */

    if (
        cinematicFlash>0
    ) {

        ctx.fillStyle =
            `rgba(255,255,255,${cinematicFlash*.35})`;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }


    /* ---------------------------------------------
       Fade
    --------------------------------------------- */

    if (
        fade>0
    ) {

        ctx.fillStyle =
            `rgba(0,0,0,${fade})`;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

}


/* =========================================================
   MAIN GAME LOOP
========================================================= */

function update(time) {

    if(
        !lastTime
    ) {

        lastTime=time;

    }

    const dt =
        Math.min(
            (time-lastTime)/16.67,
            2
        );

    lastTime=time;


    if(
        gameStarted
    ) {

        sceneTimer +=
            dt/60;

        updateCharacters(dt);

        updateCamera(dt);

        updateParticles(dt);

        cinematicEffects(dt);


        if (
            sceneTimer >=
            scenes[sceneIndex].duration
        ) {

            if (
                sceneIndex <
                scenes.length-1
            ) {

                startScene(
                    sceneIndex+1
                );

            } else {

                showMoral();

            }

        }

    }


    drawFrame();

    requestAnimationFrame(
        update
    );

}


/* =========================================================
   MORAL
========================================================= */

function showMoral() {

    if (
        moralShown
    ) {

        return;

    }

    moralShown=true;

    setTimeout(
        () => {

            moral.style.display =
                "flex";

        },
        1800
    );

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    if(
        gameStarted
    ) {

        return;

    }

    gameStarted=true;

    titleScreen.style.display =
        "none";

    startScene(0);

}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    location.reload();

}


/* =========================================================
   EVENTS
========================================================= */

titleScreen.addEventListener(
    "click",
    startGame
);

moral.addEventListener(
    "click",
    restartGame
);


/* =========================================================
   INITIALIZATION
========================================================= */

startScene(0);

requestAnimationFrame(
    update
);

</script>
