<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Pixel Tale - The Skull & The Hare</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
    cursor: default;
}

#game-container {
    position: relative;
    width: 960px;
    height: 600px;
    max-width: 100vw;
    max-height: 100vh;
    overflow: hidden;
    background: #080914;
    border: 4px solid #34343d;
    box-shadow:
        0 0 30px rgba(120, 0, 0, .25),
        inset 0 0 50px rgba(0,0,0,.8);
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

#story-text {
    position: absolute;
    z-index: 20;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    width: 88%;
    min-height: 52px;

    padding: 12px 18px;

    color: #f1eeee;
    background:
        linear-gradient(
            rgba(5,5,8,.92),
            rgba(10,7,10,.94)
        );

    border: 2px solid #777;
    box-shadow:
        0 0 0 3px #111,
        0 5px 20px rgba(0,0,0,.8);

    text-align: center;
    font-size: 11px;
    line-height: 1.7;

    pointer-events: none;
}

#title-screen {
    position: absolute;
    inset: 0;
    z-index: 50;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            rgba(55,0,0,.25),
            rgba(0,0,0,.97) 65%
        );

    cursor: pointer;
}

#title-screen h1 {
    color: #d90000;
    font-size: 30px;
    line-height: 1.7;

    text-shadow:
        3px 3px 0 #240000,
        0 0 20px #900000,
        0 0 50px #500000;

    animation: titlePulse 2.5s infinite;
}

#title-screen p {
    margin-top: 40px;
    color: #aaa;
    font-size: 11px;
    animation: blink 1.2s infinite;
}

@keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: .25; }
}

@keyframes titlePulse {
    0%,100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.025);
    }
}

#moral {
    position: absolute;
    z-index: 60;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 75%;

    padding: 28px;

    background: rgba(0,0,0,.94);
    border: 3px solid #b00000;

    color: #ff3333;
    text-align: center;

    font-size: 13px;
    line-height: 2;

    display: none;

    box-shadow:
        0 0 20px #700000,
        inset 0 0 30px rgba(100,0,0,.25);
}
</style>
</head>

<body>

<div id="game-container">

<canvas id="gameCanvas"></canvas>

<div id="story-text"></div>

<div id="moral">
    MORAL OF THE STORY
    <br><br>
    PRIDE CAN MAKE EVEN THE FASTEST CREATURE FORGET
    <br>
    THAT TIME NEVER STOPS.
    <br><br>
    CLICK TO RESTART
</div>

<div id="title-screen">
    <h1>
        DARK PIXEL TALE
        <br>
        THE SKULL & THE HARE
    </h1>

    <p>CLICK TO BEGIN</p>
</div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = 960;
canvas.height = 600;

ctx.imageSmoothingEnabled = false;

const storyText = document.getElementById("story-text");
const titleScreen = document.getElementById("title-screen");
const moral = document.getElementById("moral");

let gameStarted = false;
let gameTime = 0;
let sceneIndex = 0;

let cameraX = 0;
let cameraTargetX = 0;

let transition = 0;
let transitionDirection = 0;

let particles = [];

let hareKilled = false;
let decapitationFrame = 0;

const WORLD_END = 2600;

/* =========================================================
   STORY
========================================================= */

const scenes = [

{
    duration: 260,
    type: "opening",
    text:
    "Deep inside a cursed forest, the Hare laughed at the creature of death."
},

{
    duration: 260,
    type: "mock_death",
    text:
    "HARE: \"You call yourself Death? You're far too slow to catch me!\""
},

{
    duration: 280,
    type: "challenge",
    text:
    "The Skull raised its ancient head. It had existed for centuries... and its pride was awakened."
},

{
    duration: 280,
    type: "challenge_close",
    text:
    "SKULL: \"If you believe yourself faster than Death... prove it. Race me.\""
},

{
    duration: 240,
    type: "start",
    text:
    "The challenge was accepted. The forest fell silent."
},

{
    duration: 300,
    type: "race",
    text:
    "The Hare exploded forward, leaving the Skull far behind."
},

{
    duration: 300,
    type: "hare_far",
    text:
    "The Hare raced deeper into the forest, certain that victory was already his."
},

{
    duration: 300,
    type: "skull_progress",
    text:
    "The Skull never stopped. Step after step. Slow... patient... eternal."
},

{
    duration: 300,
    type: "hare_return",
    text:
    "Far ahead, the Hare looked back. The Skull was nowhere to be seen."
},

{
    duration: 280,
    type: "bridge",
    text:
    "The Skull crossed an ancient bridge of bones beneath the dead moon."
},

{
    duration: 300,
    type: "hare_thinks",
    text:
    "The Hare finally reached the distant meadow beyond the bridge."
},

{
    duration: 320,
    type: "hare_reflects",
    text:
    "HARE: \"I'm so far ahead... I've got plenty of time.\""
},

{
    duration: 300,
    type: "hare_rest",
    text:
    "HARE: \"I'll rest for a moment. Then I'll finish the race.\""
},

{
    duration: 320,
    type: "sleep",
    text:
    "The confident Hare closed his eyes... unaware that Death was still moving."
},

{
    duration: 350,
    type: "skull_approach",
    text:
    "The Skull emerged from the darkness and slowly approached the sleeping Hare."
},

{
    duration: 260,
    type: "realization",
    text:
    "SKULL: \"You mocked Death because you believed time belonged to you.\""
},

{
    duration: 250,
    type: "decision",
    text:
    "The Skull looked toward the finish line... then back at the sleeping Hare."
},

{
    duration: 180,
    type: "decapitation",
    text:
    "The Skull raised its ancient blade."
},

{
    duration: 220,
    type: "death",
    text:
    "One silent strike. The Hare never woke."
},

{
    duration: 280,
    type: "victory",
    text:
    "The Skull stood victorious beneath the moon."
},

{
    duration: 320,
    type: "ending",
    text:
    "Death had never been fast. It had simply never stopped walking."
}

];

/* =========================================================
   CHARACTERS
========================================================= */

class Skull {

    constructor() {
        this.x = 80;
        this.y = 395;

        this.walkFrame = 0;
        this.walkTimer = 0;

        this.bob = 0;
        this.armSwing = 0;
    }

    update(moving = true) {

        if (!moving) return;

        this.walkTimer++;

        if (this.walkTimer > 7) {
            this.walkFrame =
                this.walkFrame === 0 ? 1 : 0;

            this.walkTimer = 0;
        }

        this.bob =
            this.walkFrame === 0 ? 0 : -3;

        this.armSwing =
            this.walkFrame === 0 ? -2 : 2;
    }

    draw(scale = 1) {

        const x = Math.round(this.x - 25 * scale);
        const y = Math.round(this.y + this.bob - 55 * scale);

        ctx.save();

        ctx.translate(x, y);
        ctx.scale(scale, scale);

        /* cloak */

        ctx.fillStyle = "#15151b";

        ctx.fillRect(-2, 30, 54, 72);

        ctx.fillStyle = "#25252c";

        ctx.fillRect(-8, 38, 10, 55);
        ctx.fillRect(48, 38, 10, 55);

        /* cloak highlights */

        ctx.fillStyle = "#3c3c44";

        ctx.fillRect(4, 38, 5, 58);
        ctx.fillRect(42, 38, 5, 58);

        /* hood */

        ctx.fillStyle = "#303038";

        ctx.fillRect(-7, 2, 64, 42);

        ctx.fillRect(2, -8, 46, 12);

        /* skull */

        ctx.fillStyle = "#d7d2c6";

        ctx.fillRect(5, 8, 40, 37);

        ctx.fillRect(10, 3, 30, 7);

        /* skull shadows */

        ctx.fillStyle = "#9a958b";

        ctx.fillRect(5, 36, 40, 8);
        ctx.fillRect(10, 8, 5, 28);
        ctx.fillRect(35, 8, 7, 28);

        /* eyes */

        ctx.fillStyle = "#050505";

        ctx.fillRect(11, 15, 10, 10);
        ctx.fillRect(29, 15, 10, 10);

        /* red pupils */

        ctx.fillStyle = "#d00000";

        ctx.fillRect(14, 18, 4, 4);
        ctx.fillRect(32, 18, 4, 4);

        /* nose */

        ctx.fillStyle = "#181818";

        ctx.fillRect(23, 25, 7, 6);

        /* jaw */

        ctx.fillStyle = "#c2bdb3";

        ctx.fillRect(12, 32, 27, 12);

        /* teeth */

        ctx.fillStyle = "#eee";

        for (let i = 0; i < 5; i++) {
            ctx.fillRect(
                14 + i * 5,
                33,
                3,
                7
            );
        }

        /* arms */

        ctx.fillStyle = "#202027";

        ctx.fillRect(
            -14,
            47 + this.armSwing,
            9,
            38
        );

        ctx.fillRect(
            53,
            47 - this.armSwing,
            9,
            38
        );

        /* hand */

        ctx.fillStyle = "#bdb7ad";

        ctx.fillRect(
            -14,
            82 + this.armSwing,
            10,
            8
        );

        ctx.fillRect(
            53,
            82 - this.armSwing,
            10,
            8
        );

        /* blade */

        if (sceneIndex >= 17) {

            ctx.fillStyle = "#c8c8c8";

            ctx.fillRect(
                61,
                20,
                5,
                65
            );

            ctx.fillStyle = "#fff";

            ctx.fillRect(
                66,
                20,
                3,
                55
            );

            ctx.fillStyle = "#5a3030";

            ctx.fillRect(
                58,
                80,
                16,
                5
            );
        }

        ctx.restore();
    }
}


class Hare {

    constructor() {

        this.x = 100;
        this.y = 400;

        this.runFrame = 0;
        this.timer = 0;

        this.sleeping = false;
        this.dead = false;
    }

    update(running = true) {

        if (!running) return;

        this.timer++;

        if (this.timer > 5) {

            this.runFrame =
                this.runFrame === 0 ? 1 : 0;

            this.timer = 0;
        }
    }

    draw(scale = 1) {

        const x = Math.round(this.x - 25 * scale);
        const y = Math.round(this.y - 60 * scale);

        ctx.save();

        ctx.translate(x, y);
        ctx.scale(scale, scale);

        let leg = this.runFrame === 0 ? 0 : 7;

        if (this.sleeping) {

            /* sleeping pose */

            ctx.fillStyle = "#7e4527";

            ctx.fillRect(
                -5,
                45,
                85,
                25
            );

            ctx.fillStyle = "#9f5d34";

            ctx.fillRect(
                52,
                35,
                35,
                27
            );

            /* head */

            ctx.fillRect(
                72,
                25,
                28,
                27
            );

            /* ears lying down */

            ctx.fillStyle = "#804522";

            ctx.fillRect(
                82,
                5,
                35,
                10
            );

            ctx.fillRect(
                80,
                14,
                30,
                8
            );

            /* closed eye */

            ctx.fillStyle = "#24100b";

            ctx.fillRect(
                89,
                39,
                7,
                2
            );

            /* Z */

            ctx.fillStyle = "#aaa";

            ctx.font = "12px monospace";

            ctx.fillText("Z", 108, 5);
            ctx.fillText("Z", 120, -12);

        } else {

            /* body */

            ctx.fillStyle = "#8f4e2a";

            ctx.fillRect(
                10,
                35,
                48,
                45
            );

            /* belly */

            ctx.fillStyle = "#b96b3b";

            ctx.fillRect(
                18,
                43,
                32,
                30
            );

            /* head */

            ctx.fillStyle = "#a95d32";

            ctx.fillRect(
                42,
                15,
                38,
                35
            );

            /* ears */

            ctx.fillStyle = "#7d4024";

            ctx.fillRect(
                45,
                -32,
                12,
                48
            );

            ctx.fillRect(
                64,
                -38,
                12,
                54
            );

            /* inner ears */

            ctx.fillStyle = "#d88c88";

            ctx.fillRect(
                49,
                -25,
                5,
                30
            );

            ctx.fillRect(
                68,
                -31,
                5,
                35
            );

            /* eye */

            ctx.fillStyle = "#080505";

            ctx.fillRect(
                66,
                26,
                7,
                7
            );

            /* eye shine */

            ctx.fillStyle = "#fff";

            ctx.fillRect(
                68,
                27,
                2,
                2
            );

            /* nose */

            ctx.fillStyle = "#e18b91";

            ctx.fillRect(
                78,
                37,
                7,
                5
            );

            /* legs */

            ctx.fillStyle = "#77401f";

            ctx.fillRect(
                15,
                72 + leg,
                12,
                30 - leg
            );

            ctx.fillRect(
                43,
                72 - leg,
                12,
                30 + leg
            );

            /* tail */

            ctx.fillStyle = "#eee";

            ctx.fillRect(
                3,
                39,
                18,
                18
            );

            ctx.fillStyle = "#fff";

            ctx.fillRect(
                7,
                35,
                13,
                15
            );
        }

        ctx.restore();
    }
}


const skull = new Skull();
const hare = new Hare();

/* =========================================================
   PARTICLES
========================================================= */

function spawnDust(x, y, amount = 2) {

    for (let i = 0; i < amount; i++) {

        particles.push({
            x: x + Math.random() * 20 - 10,
            y: y,
            vx: Math.random() * 2 - 1,
            vy: -Math.random() * 1.5,
            life: 25 + Math.random() * 20
        });
    }
}


function updateParticles() {

    for (const p of particles) {

        p.x += p.vx;
        p.y += p.vy;
        p.vy += .04;
        p.life--;
    }

    particles =
        particles.filter(p => p.life > 0);
}


function drawParticles() {

    for (const p of particles) {

        ctx.fillStyle =
            "rgba(160,150,140," +
            (p.life / 45) +
            ")";

        ctx.fillRect(
            Math.round(p.x - cameraX),
            Math.round(p.y),
            3,
            3
        );
    }
}

/* =========================================================
   WORLD
========================================================= */

function drawWorld() {

    /* sky */

    const gradient =
        ctx.createLinearGradient(
            0, 0,
            0, canvas.height
        );

    gradient.addColorStop(0, "#050618");
    gradient.addColorStop(.55, "#101329");
    gradient.addColorStop(1, "#21171c");

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /* moon */

    const moonX = 760 - cameraX * .05;

    ctx.fillStyle = "#d9c7a3";

    ctx.beginPath();

    ctx.arc(
        moonX,
        100,
        48,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* moon craters */

    ctx.fillStyle = "#b9aa8d";

    ctx.fillRect(moonX - 20, 80, 9, 7);
    ctx.fillRect(moonX + 12, 105, 13, 6);
    ctx.fillRect(moonX - 4, 120, 7, 5);

    /* distant mountains */

    ctx.fillStyle = "#0b0d19";

    ctx.beginPath();

    ctx.moveTo(0,350);

    for (let x=0; x<=960; x+=80) {

        const worldX =
            x + cameraX * .15;

        const h =
            50 +
            Math.abs(
                Math.sin(worldX * .02)
            ) * 70;

        ctx.lineTo(
            x,
            350 - h
        );
    }

    ctx.lineTo(960,400);
    ctx.lineTo(0,400);

    ctx.fill();

    /* ground */

    ctx.fillStyle = "#17151a";

    ctx.fillRect(
        0,
        400,
        canvas.width,
        200
    );

    /* road */

    ctx.fillStyle = "#211d20";

    ctx.fillRect(
        -cameraX,
        405,
        WORLD_END,
        80
    );

    /* road texture */

    for (
        let x =
            Math.floor(cameraX / 45) * 45;
        x < cameraX + 1000;
        x += 45
    ) {

        ctx.fillStyle =
            x % 90 === 0
            ? "#342d30"
            : "#292428";

        ctx.fillRect(
            Math.round(x - cameraX),
            440 + (x % 3),
            20,
            4
        );
    }

    drawForest();
    drawBridge();
    drawFinishLine();
}


function drawForest() {

    for (
        let x =
            Math.floor(cameraX / 120) * 120 - 120;
        x < cameraX + 1100;
        x += 120
    ) {

        const screenX =
            x - cameraX;

        const height =
            80 +
            Math.abs(
                Math.sin(x * .04)
            ) * 90;

        /* trunk */

        ctx.fillStyle = "#24191a";

        ctx.fillRect(
            screenX,
            400 - height,
            15,
            height
        );

        /* branches */

        ctx.fillRect(
            screenX - 18,
            320 - height * .25,
            50,
            8
        );

        /* canopy */

        ctx.fillStyle = "#0c1117";

        ctx.fillRect(
            screenX - 30,
            300 - height,
            75,
            60
        );

        ctx.fillRect(
            screenX - 15,
            275 - height,
            45,
            30
        );
    }
}


function drawBridge() {

    const bridgeStart = 1200;
    const bridgeLength = 360;

    const sx = bridgeStart - cameraX;

    if (
        sx > canvas.width ||
        sx + bridgeLength < 0
    ) return;

    /* abyss */

    ctx.fillStyle = "#050508";

    ctx.fillRect(
        sx,
        405,
        bridgeLength,
        100
    );

    /* bones */

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const x =
            sx + i * 20;

        ctx.fillStyle =
            i % 2 === 0
            ? "#c5b89e"
            : "#8e826d";

        ctx.fillRect(
            x,
            420 + Math.sin(i) * 3,
            18,
            9
        );

        ctx.fillRect(
            x + 7,
            429,
            5,
            18
        );
    }

    /* side bones */

    ctx.fillStyle = "#aaa08d";

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const x =
            sx + i * 55;

        ctx.fillRect(
            x,
            390,
            7,
            35
        );

        ctx.fillRect(
            x + 5,
            390,
            28,
            7
        );
    }
}


/*
IMPORTANT:
The finish line is deliberately far beyond
the bridge.
*/

function drawFinishLine() {

    const finishX = 2050;

    const sx =
        finishX - cameraX;

    if (
        sx < -100 ||
        sx > canvas.width + 100
    ) return;

    /* finish road */

    ctx.fillStyle = "#c8c8c8";

    for (
        let i = 0;
        i < 14;
        i++
    ) {

        ctx.fillStyle =
            i % 2 === 0
            ? "#eee"
            : "#222";

        ctx.fillRect(
            sx,
            405 + i * 6,
            20,
            6
        );
    }

    /* flag pole */

    ctx.fillStyle = "#bcbcbc";

    ctx.fillRect(
        sx + 15,
        250,
        5,
        155
    );

    /* flag */

    ctx.fillStyle = "#9b0000";

    ctx.beginPath();

    ctx.moveTo(
        sx + 20,
        255
    );

    ctx.lineTo(
        sx + 95,
        275
    );

    ctx.lineTo(
        sx + 20,
        295
    );

    ctx.fill();

    /* finish glow */

    ctx.fillStyle =
        "rgba(255,0,0,.08)";

    ctx.fillRect(
        sx - 20,
        300,
        130,
        120
    );
}

/* =========================================================
   CAMERA
========================================================= */

function setCameraTarget(targetX) {

    cameraTargetX =
        targetX - canvas.width * .5;
}


function updateCamera() {

    cameraX +=
        (cameraTargetX - cameraX)
        * .08;

    cameraX =
        Math.max(
            0,
            Math.min(
                WORLD_END - canvas.width,
                cameraX
            )
        );
}

/* =========================================================
   SCENE MANAGEMENT
========================================================= */

function enterScene(index) {

    sceneIndex = index;

    storyText.textContent =
        scenes[index].text;

    transition = 12;

    /* scene-specific setup */

    switch (scenes[index].type) {

        case "opening":

            skull.x = 300;
            hare.x = 470;

            break;

        case "mock_death":

            skull.x = 390;
            hare.x = 520;

            break;

        case "challenge":

            skull.x = 430;
            hare.x = 540;

            break;

        case "challenge_close":

            skull.x = 460;
            hare.x = 540;

            break;

        case "start":

            skull.x = 400;
            hare.x = 455;

            break;

        case "race":

            hare.x = 720;
            skull.x = 500;

            break;

        case "hare_far":

            hare.x = 980;
            skull.x = 650;

            break;

        case "skull_progress":

            skull.x = 1050;
            hare.x = 1150;

            break;

        case "hare_return":

            hare.x = 1320;
            skull.x = 1100;

            break;

        case "bridge":

            skull.x = 1420;
            hare.x = 1550;

            break;

        case "hare_thinks":

            hare.x = 1760;
            skull.x = 1480;

            break;

        case "hare_reflects":

            hare.x = 1780;
            skull.x = 1540;

            break;

        case "hare_rest":

            hare.x = 1810;
            skull.x = 1630;

            break;

        case "sleep":

            hare.x = 1810;
            skull.x = 1700;

            hare.sleeping = true;

            break;

        case "skull_approach":

            hare.x = 1810;
            skull.x = 1760;

            hare.sleeping = true;

            break;

        case "realization":

            skull.x = 1780;
            hare.x = 1810;

            break;

        case "decision":

            skull.x = 1800;
            hare.x = 1810;

            break;

        case "decapitation":

            skull.x = 1810;
            hare.x = 1820;

            break;

        case "death":

            skull.x = 1840;
            hare.x = 1810;

            hareKilled = true;

            break;

        case "victory":

            skull.x = 1930;
            hare.x = 1810;

            break;

        case "ending":

            skull.x = 1990;
            hare.x = 1810;

            break;
    }
}

/* =========================================================
   SCENE CAMERA TARGET
========================================================= */

function focusScene() {

    const type =
        scenes[sceneIndex].type;

    let target;

    if (
        type === "opening" ||
        type === "mock_death" ||
        type === "challenge" ||
        type === "challenge_close"
    ) {

        target =
            (skull.x + hare.x) / 2;

    }
    else if (
        type === "hare_far" ||
        type === "hare_return" ||
        type === "hare_thinks" ||
        type === "hare_reflects" ||
        type === "hare_rest" ||
        type === "sleep"
    ) {

        target = hare.x;

    }
    else {

        target = skull.x;
    }

    setCameraTarget(target);
}

/* =========================================================
   CINEMATIC CHARACTER DRAW
========================================================= */

function drawCharacters() {

    const type =
        scenes[sceneIndex].type;

    /*
    Every shot deliberately places the important
    character around the center of the frame.
    */

    if (
        type === "opening" ||
        type === "mock_death" ||
        type === "challenge" ||
        type === "challenge_close"
    ) {

        skull.draw(1.45);
        hare.draw(1.45);

        return;
    }

    if (
        type === "hare_thinks" ||
        type === "hare_reflects" ||
        type === "hare_rest" ||
        type === "sleep"
    ) {

        hare.draw(1.65);

        /* Skull remains distant */

        ctx.save();

        ctx.globalAlpha = .55;

        skull.draw(.7);

        ctx.restore();

        return;
    }

    if (
        type === "skull_approach" ||
        type === "realization" ||
        type === "decision"
    ) {

        hare.draw(1.35);
        skull.draw(1.55);

        return;
    }

    if (type === "decapitation") {

        skull.draw(1.8);
        hare.draw(1.8);

        drawStrikeEffect();

        return;
    }

    if (type === "death") {

        skull.draw(1.7);

        drawDeadHare();

        return;
    }

    if (
        type === "victory" ||
        type === "ending"
    ) {

        skull.draw(1.9);

        drawDeadHare();

        return;
    }

    skull.draw(1.3);
    hare.draw(1.3);
}

/* =========================================================
   DECAPITATION
========================================================= */

function drawStrikeEffect() {

    const centerX =
        canvas.width / 2;

    const centerY = 350;

    if (decapitationFrame < 35) {

        ctx.save();

        ctx.strokeStyle =
            "#e5e5e5";

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(
            centerX + 90,
            centerY - 100
        );

        ctx.lineTo(
            centerX - 50,
            centerY + 40
        );

        ctx.stroke();

        ctx.restore();

    }

    if (decapitationFrame >= 35) {

        ctx.fillStyle =
            "rgba(255,0,0,.65)";

        for (
            let i = 0;
            i < 12;
            i++
        ) {

            ctx.fillRect(
                centerX - 30 +
                Math.random() * 80,

                centerY - 10 +
                Math.random() * 40,

                4,
                4
            );
        }
    }
}


function drawDeadHare() {

    ctx.save();

    ctx.translate(
        canvas.width / 2 - 10,
        390
    );

    ctx.rotate(-.08);

    ctx.fillStyle = "#75401f";

    ctx.fillRect(
        -60,
        0,
        105,
        27
    );

    /* severed neck */

    ctx.fillStyle = "#741010";

    ctx.fillRect(
        25,
        -2,
        18,
        12
    );

    /* head separated */

    ctx.fillStyle = "#a95d32";

    ctx.fillRect(
        48,
        -35,
        35,
        28
    );

    ctx.fillStyle = "#7d4024";

    ctx.fillRect(
        52,
        -65,
        10,
        32
    );

    ctx.fillRect(
        68,
        -67,
        10,
        34
    );

    /* closed eye */

    ctx.fillStyle = "#160808";

    ctx.fillRect(
        72,
        -22,
        7,
        3
    );

    /* blood pixels */

    ctx.fillStyle = "#9e0000";

    ctx.fillRect(
        42,
        0,
        6,
        15
    );

    ctx.fillRect(
        30,
        5,
        4,
        12
    );

    ctx.restore();
}

/* =========================================================
   GAME LOOP
========================================================= */

let sceneTimer = 0;

function updateScene() {

    sceneTimer++;

    const current =
        scenes[sceneIndex];

    if (
        sceneTimer >= current.duration
        &&
        sceneIndex < scenes.length - 1
    ) {

        sceneTimer = 0;

        if (
            scenes[sceneIndex].type
            === "decapitation"
        ) {

            hareKilled = true;
        }

        enterScene(sceneIndex + 1);
    }

    /* character animation */

    const type =
        current.type;

    skull.update(
        type !== "hare_reflects" &&
        type !== "hare_rest" &&
        type !== "sleep" &&
        type !== "realization"
    );

    hare.update(
        type === "race" ||
        type === "hare_far" ||
        type === "hare_return"
    );

    /* dust */

    if (
        type === "race" ||
        type === "hare_far" ||
        type === "skull_progress" ||
        type === "bridge"
    ) {

        if (gameTime % 8 === 0) {

            spawnDust(
                skull.x,
                skull.y - 5,
                1
            );
        }

        if (
            type === "race" ||
            type === "hare_far"
        ) {

            if (gameTime % 5 === 0) {

                spawnDust(
                    hare.x,
                    hare.y - 5,
                    2
                );
            }
        }
    }

    if (
        type === "decapitation"
    ) {

        decapitationFrame++;

    } else {

        decapitationFrame = 0;
    }
}

/* =========================================================
   RENDER
========================================================= */

function render() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawWorld();

    focusScene();
    updateCamera();

    /*
    Characters are drawn after the world.
    The camera is already centered around the
    protagonist of the current shot.
    */

    drawCharacters();

    drawParticles();

    updateParticles();

    /* cinematic vignette */

    const vignette =
        ctx.createRadialGradient(
            480,
            300,
            180,
            480,
            300,
            520
        );

    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        "rgba(0,0,0,.65)"
    );

    ctx.fillStyle = vignette;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /* transition */

    if (transition > 0) {

        ctx.fillStyle =
            `rgba(0,0,0,${transition / 12})`;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        transition--;
    }
}

/* =========================================================
   MAIN LOOP
========================================================= */

function loop() {

    if (gameStarted) {

        gameTime++;

        updateScene();

        render();

        if (
            sceneIndex === scenes.length - 1 &&
            sceneTimer > 250
        ) {

            moral.style.display =
                "block";

            gameStarted = false;
        }

    } else {

        render();
    }

    requestAnimationFrame(loop);
}

/* =========================================================
   START / RESTART
========================================================= */

function startGame() {

    if (gameStarted) return;

    titleScreen.style.display =
        "none";

    moral.style.display =
        "none";

    gameStarted = true;

    gameTime = 0;
    sceneTimer = 0;
    sceneIndex = 0;

    hareKilled = false;

    hare.sleeping = false;
    hare.dead = false;

    skull.x = 300;
    hare.x = 470;

    enterScene(0);
}


function restartGame() {

    moral.style.display =
        "none";

    titleScreen.style.display =
        "flex";

    gameStarted = false;
}


titleScreen.addEventListener(
    "click",
    startGame
);

moral.addEventListener(
    "click",
    restartGame
);

/* initial frame */

enterScene(0);

loop();

</script>

</body>
