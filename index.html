<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dark Pixel Tale — The Skull & The Hare</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020204;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Press Start 2P', monospace;
    cursor: none;
}

#game-container {
    position: relative;
    width: min(96vw, 1200px);
    aspect-ratio: 16 / 10;
    overflow: hidden;

    background: #050509;

    border: 4px solid #29292f;

    box-shadow:
        0 0 0 2px #000,
        0 0 60px rgba(130, 0, 0, .2);
}

canvas {
    display: block;
    width: 100%;
    height: 100%;

    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

/* =========================================================
   STORY BOX
========================================================= */

#story-box {

    position: absolute;

    left: 7%;
    right: 7%;
    bottom: 8px;

    min-height: 45px;

    padding: 7px 20px;

    background:
        linear-gradient(
            rgba(0,0,0,.88),
            rgba(4,4,7,.96)
        );

    border-top: 2px solid rgba(180,180,180,.18);

    border-bottom: 2px solid rgba(180,180,180,.08);

    box-shadow:
        0 -10px 30px rgba(0,0,0,.65);

    z-index: 20;

    pointer-events: none;
}

#story-text {

    color: #dedede;

    text-align: center;

    font-size: clamp(6px, .8vw, 10px);

    line-height: 1.7;

    text-shadow:
        2px 2px #000;

    min-height: 24px;
}

#scene-counter {

    position: absolute;

    top: 9px;
    left: 12px;

    z-index: 30;

    color: #51515b;

    font-size: 6px;
}

/* =========================================================
   TITLE
========================================================= */

#title-screen {

    position: absolute;
    inset: 0;

    z-index: 50;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            rgba(80,0,0,.25),
            rgba(0,0,0,.98) 72%
        );
}

#title-screen h1 {

    color: #d40000;

    font-size: clamp(18px, 3vw, 35px);

    line-height: 1.7;

    text-shadow:
        3px 3px 0 #250000,
        0 0 20px #d00000,
        0 0 50px rgba(255,0,0,.55);

    animation: titlePulse 3s infinite;
}

.subtitle {

    margin-top: 18px;

    color: #555;

    font-size: 8px;

    letter-spacing: 3px;
}

.start {

    margin-top: 45px;

    color: #ddd;

    font-size: 11px;

    animation: blink 1s steps(2) infinite;
}

@keyframes blink {

    0%,45% {
        opacity: 1;
    }

    46%,100% {
        opacity: 0;
    }
}

@keyframes titlePulse {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.035);
    }
}

/* =========================================================
   MORAL
========================================================= */

#moral {

    position: absolute;

    inset: 0;

    z-index: 60;

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            rgba(70,0,0,.35),
            rgba(0,0,0,.98)
        );

    color: #e00000;

    font-size: clamp(9px,1.4vw,16px);

    line-height: 2;

    text-shadow:
        0 0 15px #ff0000;
}

.restart {

    margin-top: 35px;

    color: #666;

    font-size: 8px;

    animation: blink 1.2s steps(2) infinite;
}

</style>
</head>

<body>

<div id="game-container">

<canvas id="gameCanvas"></canvas>

<div id="scene-counter">
SCENE 01
</div>

<div id="story-box">
<div id="story-text">Loading...</div>
</div>

<div id="moral">

    <div>
        MORAL OF THE STORY:
        <br><br>
        DON'T TRUST EVEN YOURSELF.
        <br>
        THE DARKNESS LIES WITHIN US ALL.
    </div>

    <div class="restart">
        CLICK TO RESTART
    </div>

</div>

<div id="title-screen">

    <h1>
        DARK PIXEL TALE
        <br>
        THE SKULL & THE HARE
    </h1>

    <div class="subtitle">
        A DARK FAIRY TALE
    </div>

    <div class="start">
        CLICK TO BEGIN
    </div>

</div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

canvas.width = 960;
canvas.height = 600;

ctx.imageSmoothingEnabled = false;


/* =========================================================
   DOM
========================================================= */

const titleScreen =
    document.getElementById("title-screen");

const storyText =
    document.getElementById("story-text");

const sceneCounter =
    document.getElementById("scene-counter");

const moral =
    document.getElementById("moral");


/* =========================================================
   GAME STATE
========================================================= */

let started = false;

let sceneIndex = 0;

let sceneTime = 0;

let lastTime = 0;

let worldCameraX = 0;

let cameraTargetX = 0;

let cameraZoom = 1;

let cameraTargetZoom = 1;

let cameraShake = 0;

let flash = 0;

let darkness = 0;

let moralShown = false;


/* =========================================================
   WORLD
========================================================= */

/*
    The race is deliberately very long.

    Bridge:
        WORLD X ~ 1500

    Finish:
        WORLD X ~ 2800

    Hare rests:
        WORLD X ~ 2350

    Therefore the hare is still
    comfortably ahead when it sleeps.
*/

const WORLD_FINISH = 2800;

const WORLD_BRIDGE = 1500;


/* =========================================================
   CHARACTERS
========================================================= */

const skull = {

    x: 120,
    y: 390,

    walkFrame: 0,
    walkTimer: 0,

    jump: 0,

    swordAngle: 0,

    attacking: false,

    attackProgress: 0,

    idleTimer: 0

};


const hare = {

    x: 160,
    y: 390,

    walkFrame: 0,
    walkTimer: 0,

    earMotion: 0,

    sleeping: false,

    sitting: false,

    lyingDown: false,

    headless: false,

    headOffsetX: 0,

    headOffsetY: 0,

    headVisible: true,

    sleepProgress: 0,

    lookBack: 0,

    idleTimer: 0

};


/* =========================================================
   PARTICLES
========================================================= */

const particles = [];


function spawnParticle(
    x,
    y,
    type = "dust"
) {

    particles.push({

        x,
        y,

        vx:
            (Math.random()-.5) *
            (type === "blood" ? 3 : 1.2),

        vy:
            type === "blood"
                ? -Math.random()*3
                : -Math.random()*.7,

        life: 1,

        size:
            Math.random() < .75
                ? 2
                : 3,

        type

    });

}


function updateParticles(dt) {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        if (
            p.type === "blood"
        ) {

            p.vy +=
                .07 * dt;

        } else {

            p.vy +=
                .015 * dt;

        }

        p.life -=
            .012 * dt;

        if (
            p.life <= 0
        ) {

            particles.splice(i,1);

        }

    }

}


function drawParticles() {

    for (
        const p of particles
    ) {

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            p.type === "blood"
                ? "#980000"
                : "#55515a";

        ctx.fillRect(
            Math.floor(
                p.x - worldCameraX
            ),
            Math.floor(p.y),
            p.size,
            p.size
        );

    }

    ctx.globalAlpha = 1;

}


/* =========================================================
   PIXEL HELPERS
========================================================= */

function rect(
    x,
    y,
    w,
    h,
    color
) {

    ctx.fillStyle = color;

    ctx.fillRect(
        Math.floor(x),
        Math.floor(y),
        Math.floor(w),
        Math.floor(h)
    );

}


function pixelCircle(
    x,
    y,
    r,
    color
) {

    ctx.fillStyle = color;

    for (
        let yy = -r;
        yy <= r;
        yy += 3
    ) {

        for (
            let xx = -r;
            xx <= r;
            xx += 3
        ) {

            if (
                xx*xx +
                yy*yy <=
                r*r
            ) {

                rect(
                    x+xx,
                    y+yy,
                    3,
                    3,
                    color
                );

            }

        }

    }

}


/* =========================================================
   SKY
========================================================= */

function drawSky() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            600
        );

    gradient.addColorStop(
        0,
        "#03030c"
    );

    gradient.addColorStop(
        .45,
        "#0c1022"
    );

    gradient.addColorStop(
        1,
        "#21151b"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        960,
        600
    );

}


/* =========================================================
   STARS
========================================================= */

function drawStars() {

    for (
        let i = 0;
        i < 130;
        i++
    ) {

        let x =
            i*137 -
            worldCameraX*.035;

        x =
            ((x%1000)+1000)%1000;

        const y =
            (i*67)%280;

        const size =
            i%11===0
                ? 2
                : 1;

        rect(
            x,
            y,
            size,
            size,
            i%7===0
                ? "#777783"
                : "#363642"
        );

    }

}


/* =========================================================
   MOON
========================================================= */

function drawMoon() {

    const x =
        770 -
        worldCameraX*.025;

    const y = 100;

    const glow =
        ctx.createRadialGradient(
            x,
            y,
            15,
            x,
            y,
            150
        );

    glow.addColorStop(
        0,
        "rgba(170,0,0,.32)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        150,
        0,
        Math.PI*2
    );

    ctx.fill();

    pixelCircle(
        x,
        y,
        43,
        "#812b31"
    );

    pixelCircle(
        x-6,
        y-5,
        37,
        "#a43c3e"
    );

    rect(
        x-19,
        y-12,
        10,
        6,
        "#6f242a"
    );

    rect(
        x+14,
        y+12,
        8,
        7,
        "#70252a"
    );

}


/* =========================================================
   MOUNTAINS
========================================================= */

function drawMountains() {

    ctx.fillStyle =
        "#090913";

    ctx.beginPath();

    ctx.moveTo(
        0,
        390
    );

    for (
        let x=0;
        x<=960;
        x+=50
    ) {

        const height =
            60 +
            Math.sin(x*.021)*40 +
            Math.sin(x*.051)*22;

        ctx.lineTo(
            x,
            390-height
        );

    }

    ctx.lineTo(
        960,
        600
    );

    ctx.lineTo(
        0,
        600
    );

    ctx.fill();

}


/* =========================================================
   TREES
========================================================= */

function drawTree(
    worldX,
    scale,
    depth
) {

    const x =
        worldX -
        worldCameraX*depth;

    const y = 410;

    rect(
        x-8*scale,
        y-180*scale,
        16*scale,
        180*scale,
        "#17131a"
    );

    rect(
        x-52*scale,
        y-150*scale,
        104*scale,
        8*scale,
        "#141117"
    );

    rect(
        x-38*scale,
        y-120*scale,
        76*scale,
        7*scale,
        "#141117"
    );

    pixelCircle(
        x,
        y-200*scale,
        58*scale,
        "#09090f"
    );

    pixelCircle(
        x-35*scale,
        y-175*scale,
        38*scale,
        "#0a0910"
    );

    pixelCircle(
        x+38*scale,
        y-172*scale,
        40*scale,
        "#0a0910"
    );

}


function drawForest() {

    for (
        let i=0;
        i<35;
        i++
    ) {

        drawTree(
            i*120,
            .65,
            .25
        );

    }

    for (
        let i=0;
        i<30;
        i++
    ) {

        drawTree(
            i*140+40,
            .9,
            .48
        );

    }

}


/* =========================================================
   GROUND
========================================================= */

function drawGround() {

    rect(
        0,
        405,
        960,
        195,
        "#111015"
    );

    for (
        let i=0;
        i<180;
        i++
    ) {

        let x =
            i*71 -
            worldCameraX*.75;

        x =
            ((x%1000)+1000)%1000;

        const y =
            415+(i*43)%170;

        rect(
            x,
            y,
            i%6===0 ? 5 : 2,
            2,
            i%4===0
                ? "#302b33"
                : "#1c191f"
        );

    }

}


/* =========================================================
   GRAVESTONES
========================================================= */

function drawGravestone(
    worldX,
    scale=1
) {

    const x =
        worldX -
        worldCameraX*.78;

    const y = 430;

    rect(
        x-16*scale,
        y-35*scale,
        32*scale,
        35*scale,
        "#3b3740"
    );

    pixelCircle(
        x,
        y-35*scale,
        16*scale,
        "#3b3740"
    );

    rect(
        x-9*scale,
        y-18*scale,
        18*scale,
        3*scale,
        "#242129"
    );

    rect(
        x-2*scale,
        y-27*scale,
        4*scale,
        18*scale,
        "#242129"
    );

}


/* =========================================================
   GRAVEYARD
========================================================= */

function drawGraveyard() {

    for (
        let i=0;
        i<24;
        i++
    ) {

        drawGravestone(
            650+i*95,
            .65+(i%3)*.12
        );

    }

}


/* =========================================================
   LONG ROAD
========================================================= */

function drawRoad() {

    /*
        The road continues for a long
        distance after the bridge.
    */

    rect(
        0,
        465,
        960,
        135,
        "#18151a"
    );

    for (
        let i=0;
        i<30;
        i++
    ) {

        let x =
            i*120 -
            worldCameraX*.9;

        x =
            ((x%1100)+1100)%1100;

        rect(
            x,
            475+(i%4)*23,
            35,
            4,
            "#29242b"
        );

    }

}


/* =========================================================
   BONE BRIDGE
========================================================= */

function drawBoneBridge() {

    const start =
        WORLD_BRIDGE -
        worldCameraX;

    /*
        The bridge is NOT the finish.

        It is a dangerous crossing
        in the middle of the journey.
    */

    for (
        let i=0;
        i<19;
        i++
    ) {

        const x =
            start+i*32;

        const wobble =
            Math.sin(
                performance.now()*.003+i
            )*2;

        rect(
            x,
            395+wobble,
            27,
            9,
            "#bdb09b"
        );

        pixelCircle(
            x+27,
            399+wobble,
            7,
            "#d0c2a5"
        );

        rect(
            x+8,
            404,
            4,
            48,
            "#675e53"
        );

        rect(
            x+21,
            404,
            4,
            48,
            "#675e53"
        );

    }

}


/* =========================================================
   FINISH LINE
========================================================= */

function drawFinishLine() {

    const x =
        WORLD_FINISH -
        worldCameraX;

    rect(
        x,
        290,
        6,
        125,
        "#d5d5d5"
    );

    for (
        let i=0;
        i<8;
        i++
    ) {

        rect(
            x+6,
            300+i*14,
            34,
            14,
            i%2===0
                ? "#eeeeee"
                : "#790000"
        );

    }

}


/* =========================================================
   DISTANT FINISH MARKERS
========================================================= */

function drawFinishSigns() {

    const x =
        WORLD_FINISH -
        worldCameraX;

    /*
        These signs appear before
        the actual finish, making the
        destination feel distant.
    */

    if (
        x < 850 &&
        x > -200
    ) {

        rect(
            x-120,
            350,
            3,
            55,
            "#51484b"
        );

        rect(
            x-120,
            350,
            50,
            18,
            "#52171b"
        );

        rect(
            x-112,
            357,
            30,
            3,
            "#b34a4a"
        );

    }

}


/* =========================================================
   DARK SPIRIT
========================================================= */

function drawSpirit() {

    const x =
        850 -
        worldCameraX;

    const y =
        290 +
        Math.sin(
            performance.now()*.003
        )*7;

    const glow =
        ctx.createRadialGradient(
            x,
            y,
            5,
            x,
            y,
            120
        );

    glow.addColorStop(
        0,
        "rgba(110,0,150,.35)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        120,
        0,
        Math.PI*2
    );

    ctx.fill();

    pixelCircle(
        x,
        y,
        28,
        "#30233d"
    );

    rect(
        x-25,
        y+10,
        50,
        48,
        "#251a2e"
    );

    rect(
        x-15,
        y-4,
        9,
        6,
        "#c000ff"
    );

    rect(
        x+7,
        y-4,
        9,
        6,
        "#c000ff"
    );

    rect(
        x-52,
        y+17,
        27,
        5,
        "#412b50"
    );

    rect(
        x+25,
        y+17,
        27,
        5,
        "#412b50"
    );

}


/* =========================================================
   SKULL
========================================================= */

function drawSkull() {

    let x =
        skull.x -
        worldCameraX;

    let y =
        skull.y -
        skull.jump;

    ctx.save();

    /*
        Shadow
    */

    rect(
        x-12,
        skull.y+48,
        58,
        7,
        "rgba(0,0,0,.55)"
    );

    /*
        Cloak back
    */

    rect(
        x-8,
        y+5,
        45,
        52,
        "#292832"
    );

    rect(
        x-14,
        y+23,
        57,
        34,
        "#1d1c25"
    );

    /*
        Cloak folds
    */

    rect(
        x-6,
        y+32,
        5,
        21,
        "#3b3944"
    );

    rect(
        x+26,
        y+30,
        5,
        24,
        "#111117"
    );

    /*
        Hood
    */

    rect(
        x-10,
        y-10,
        47,
        18,
        "#393842"
    );

    pixelCircle(
        x+14,
        y-2,
        26,
        "#393842"
    );

    /*
        Skull face
    */

    rect(
        x+0,
        y+1,
        32,
        34,
        "#cbc8bb"
    );

    rect(
        x+4,
        y+4,
        24,
        4,
        "#eeeadd"
    );

    /*
        Skull cracks
    */

    rect(
        x+19,
        y+5,
        2,
        8,
        "#8e8b83"
    );

    rect(
        x+21,
        y+12,
        5,
        2,
        "#8e8b83"
    );

    rect(
        x+5,
        y+22,
        6,
        2,
        "#99968e"
    );

    /*
        Eye sockets
    */

    rect(
        x+5,
        y+11,
        9,
        9,
        "#050506"
    );

    rect(
        x+19,
        y+11,
        9,
        9,
        "#050506"
    );

    /*
        Red eyes
    */

    rect(
        x+8,
        y+14,
        4,
        3,
        "#ff0000"
    );

    rect(
        x+22,
        y+14,
        4,
        3,
        "#ff0000"
    );

    /*
        Nose
    */

    rect(
        x+13,
        y+20,
        7,
        5,
        "#24232a"
    );

    /*
        Jaw
    */

    rect(
        x+5,
        y+27,
        23,
        8,
        "#d9d5c8"
    );

    /*
        Teeth
    */

    for (
        let i=0;
        i<5;
        i++
    ) {

        rect(
            x+8+i*4,
            y+27,
            3,
            6,
            "#29282d"
        );

    }

    /*
        Arms
    */

    const swing =
        skull.walkFrame
            ? 4
            : -4;

    rect(
        x-13,
        y+29+swing,
        10,
        25,
        "#25242d"
    );

    rect(
        x+35,
        y+29-swing,
        10,
        25,
        "#25242d"
    );

    /*
        Sword
    */

    if (
        skull.attacking
    ) {

        ctx.save();

        ctx.translate(
            x+39,
            y+34
        );

        ctx.rotate(
            skull.swordAngle
        );

        rect(
            -3,
            0,
            7,
            72,
            "#bfc3c7"
        );

        rect(
            -3,
            0,
            3,
            72,
            "#ffffff"
        );

        rect(
            -8,
            62,
            17,
            6,
            "#5b4634"
        );

        ctx.restore();

    }

    ctx.restore();

}


/* =========================================================
   HARE
========================================================= */

function drawHare() {

    let x =
        hare.x -
        worldCameraX;

    let y =
        hare.y;

    ctx.save();

    /*
        Shadow
    */

    rect(
        x-8,
        y+50,
        58,
        7,
        "rgba(0,0,0,.5)"
    );

    /*
        BODY
    */

    rect(
        x,
        y+15,
        40,
        31,
        "#81482e"
    );

    rect(
        x+5,
        y+20,
        30,
        20,
        "#9c5936"
    );

    /*
        Chest
    */

    rect(
        x+8,
        y+23,
        19,
        15,
        "#ad6842"
    );


    /*
        Sleeping / lying animation
    */

    if (
        hare.lyingDown
    ) {

        rect(
            x-10,
            y+30,
            55,
            13,
            "#8b4d31"
        );

    }


    /*
        Head
    */

    if (
        hare.headVisible &&
        !hare.headless
    ) {

        let headX =
            x+3+
            hare.headOffsetX;

        let headY =
            y-7+
            hare.headOffsetY;

        /*
            Head
        */

        rect(
            headX,
            headY,
            33,
            27,
            "#a45d38"
        );

        /*
            Cheeks
        */

        rect(
            headX+3,
            headY+15,
            27,
            9,
            "#b56a40"
        );

        /*
            Ears
        */

        const earMove =
            Math.sin(
                performance.now()*.003
            )*2;

        rect(
            headX+5,
            headY-35+earMove,
            9,
            32,
            "#82472e"
        );

        rect(
            headX+25,
            headY-39-earMove,
            9,
            36,
            "#82472e"
        );

        /*
            Inner ears
        */

        rect(
            headX+8,
            headY-29+earMove,
            3,
            21,
            "#d17c79"
        );

        rect(
            headX+28,
            headY-33-earMove,
            3,
            22,
            "#d17c79"
        );

        /*
            Eyes
        */

        if (
            hare.sleepProgress < .6
        ) {

            rect(
                headX+8,
                headY+5,
                7,
                7,
                "#070707"
            );

            rect(
                headX+23,
                headY+5,
                7,
                7,
                "#070707"
            );

        } else {

            /*
                Closed eyes
            */

            rect(
                headX+8,
                headY+8,
                8,
                2,
                "#38211f"
            );

            rect(
                headX+23,
                headY+8,
                8,
                2,
                "#38211f"
            );

        }

        /*
            Nose
        */

        rect(
            headX+16,
            headY+14,
            7,
            4,
            "#df7774"
        );

        /*
            Mouth
        */

        rect(
            headX+17,
            headY+18,
            7,
            2,
            "#512521"
        );

    }


    /*
        Tail
    */

    pixelCircle(
        x+42,
        y+23,
        9,
        "#ddd8cf"
    );


    /*
        Legs
    */

    if (
        !hare.lyingDown
    ) {

        const leg =
            hare.walkFrame
                ? 4
                : -4;

        rect(
            x+5,
            y+40+leg,
            9,
            15,
            "#703e29"
        );

        rect(
            x+26,
            y+40-leg,
            9,
            15,
            "#703e29"
        );

    }


    /*
        Sleeping pose
    */

    if (
        hare.sleeping
    ) {

        /*
            small "Z" pixels
        */

        const z =
            Math.sin(
                performance.now()*.002
            );

        rect(
            x+40,
            y-20+z*4,
            3,
            3,
            "#aaa"
        );

        rect(
            x+47,
            y-30+z*4,
            3,
            3,
            "#888"
        );

        rect(
            x+54,
            y-38+z*4,
            3,
            3,
            "#666"
        );

    }

    ctx.restore();

}


/* =========================================================
   WORLD DRAW
========================================================= */

function drawWorld() {

    drawSky();

    drawStars();

    drawMoon();

    drawMountains();

    drawForest();

    drawGround();

    drawRoad();

    drawGraveyard();

    /*
        Spirit appears during
        the early race.
    */

    if (
        sceneIndex === 6 ||
        sceneIndex === 7
    ) {

        drawSpirit();

    }

    /*
        Bridge appears much earlier
        than the finish.
    */

    if (
        sceneIndex >= 11
    ) {

        drawBoneBridge();

    }

    drawFinishSigns();

    drawFinishLine();

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt) {

    worldCameraX +=
        (
            cameraTargetX -
            worldCameraX
        ) *
        .055 *
        dt;

    cameraZoom +=
        (
            cameraTargetZoom -
            cameraZoom
        ) *
        .045 *
        dt;

    if (
        cameraShake > .2
    ) {

        worldCameraX +=
            (Math.random()-.5) *
            cameraShake;

        cameraShake *= .82;

    }

}


/* =========================================================
   FOLLOW CHARACTERS
========================================================= */

function centerOn(
    worldX,
    zoom
) {

    /*
        Characters remain around
        the center of the screen.
    */

    cameraTargetX =
        worldX - 480/zoom;

    cameraTargetZoom =
        zoom;

}

const scenes = [

/* =========================================================
   START SCENE
========================================================= */

function startScene(index) {

    sceneIndex =
        index;

    sceneTime =
        0;

    flash =
        0;

    storyText.textContent =
        scenes[index].text;

    sceneCounter.textContent =
        `SCENE ${String(index+1).padStart(2,"0")}`;


    switch(index) {

        /* INTRO */

        case 0:

            skull.x = 180;
            hare.x = 300;

            centerOn(
                220,
                1.0
            );

            break;


        /* MEET */

        case 1:

            centerOn(
                250,
                1.55
            );

            break;


        /* CHALLENGE */

        case 2:

            centerOn(
                250,
                1.8
            );

            break;


        /* ACCEPT */

        case 3:

            centerOn(
                250,
                1.6
            );

            break;


        /* RACE */

        case 4:

            skull.x = 250;
            hare.x = 340;

            hare.targetX =
                950;

            skull.targetX =
                600;

            centerOn(
                500,
                1.0
            );

            break;


        /* SLOW SKULL */

        case 5:

            skull.targetX =
                1050;

            centerOn(
                skull.x+80,
                1.15
            );

            break;


        /* SPIRIT */

        case 6:

            centerOn(
                820,
                1.35
            );

            break;


        case 7:

            centerOn(
                820,
                1.7
            );

            break;


        /* GRAVEYARD */

        case 8:

            skull.targetX =
                1300;

            centerOn(
                1100,
                1.1
            );

            break;


        /* HARES */

        case 9:

            hare.x =
                1250;

            centerOn(
                hare.x,
                1.25
            );

            break;


        case 10:

            centerOn(
                hare.x,
                1.45
            );

            break;


        /* BRIDGE */

        case 11:

            skull.targetX =
                WORLD_BRIDGE+350;

            centerOn(
                WORLD_BRIDGE,
                1.0
            );

            break;


        case 12:

            centerOn(
                skull.x,
                1.35
            );

            break;


        /* HARE SEES DISTANT FINISH */

        case 13:

            hare.x =
                2250;

            hare.targetX =
                2350;

            hare.sitting =
                false;

            hare.lyingDown =
                false;

            hare.sleeping =
                false;

            skull.targetX =
                1900;

            centerOn(
                hare.x,
                1.15
            );

            break;


        /* HARE REFLECTS */

        case 14:

            hare.targetX =
                hare.x;

            hare.sitting =
                false;

            hare.lookBack =
                1;

            centerOn(
                hare.x,
                1.45
            );

            break;


        /* HARE DECIDES TO REST */

        case 15:

            hare.sitting =
                true;

            hare.lookBack =
                0;

            centerOn(
                hare.x,
                1.55
            );

            break;


        /* RELAX */

        case 16:

            hare.sitting =
                true;

            centerOn(
                hare.x,
                1.7
            );

            break;


        /* TIRED */

        case 17:

            hare.sitting =
                false;

            hare.lyingDown =
                true;

            hare.sleepProgress =
                .35;

            centerOn(
                hare.x,
                1.75
            );

            break;


        /* ASLEEP */

        case 18:

            hare.sleeping =
                true;

            hare.lyingDown =
                true;

            hare.sleepProgress =
                1;

            centerOn(
                hare.x,
                1.8
            );

            break;


        /* SKULL APPROACH */

        case 19:

            skull.targetX =
                hare.x-95;

            centerOn(
                hare.x-20,
                1.45
            );

            break;


        /* REALIZATION */

        case 20:

            centerOn(
                hare.x-10,
                1.7
            );

            break;


        /* DECISION */

        case 21:

            centerOn(
                hare.x-5,
                1.9
            );

            break;


        /* DRAW BLADE */

        case 22:

            skull.attacking =
                true;

            skull.attackProgress =
                0;

            skull.swordAngle =
                -1.9;

            centerOn(
                hare.x-10,
                2.0
            );

            break;


        /* RAISE BLADE */

        case 23:

            skull.attacking =
                true;

            skull.swordAngle =
                -2.5;

            centerOn(
                hare.x-10,
                2.2
            );

            break;


        /* SILENCE */

        case 24:

            skull.attacking =
                true;

            skull.swordAngle =
                -2.5;

            cameraTargetZoom =
                2.35;

            centerOn(
                hare.x,
                2.35
            );

            break;


        /* STRIKE */

        case 25:

            skull.attacking =
                true;

            skull.attackProgress =
                1;

            skull.swordAngle =
                .8;

            flash =
                1;

            cameraShake =
                18;

            /*
                Decapitation moment.
            */

            hare.headless =
                true;

            hare.headVisible =
                false;

            for (
                let i=0;
                i<28;
                i++
            ) {

                spawnParticle(
                    hare.x+20,
                    hare.y+5,
                    "blood"
                );

            }

            centerOn(
                hare.x,
                2.25
            );

            break;


        /* VICTORY */

        case 26:

            skull.attacking =
                false;

            skull.jump =
                0;

            centerOn(
                skull.x,
                1.45
            );

            break;

    }

}


/* =========================================================
   CHARACTER UPDATE
========================================================= */

function updateCharacters(dt) {

    /*
        SKULL MOVEMENT
    */

    if (
        skull.targetX !== undefined &&
        Math.abs(
            skull.targetX-skull.x
        ) > 2 &&
        sceneIndex !== 22 &&
        sceneIndex !== 23 &&
        sceneIndex !== 24 &&
        sceneIndex !== 25
    ) {

        const direction =
            skull.targetX >
            skull.x
                ? 1
                : -1;

        skull.x +=
            direction*
            .48*
            dt;

        skull.walkTimer +=
            dt;

        if (
            skull.walkTimer > 7
        ) {

            skull.walkTimer=0;

            skull.walkFrame =
                1-skull.walkFrame;

        }

        if (
            Math.random()<.025
        ) {

            spawnParticle(
                skull.x+15,
                skull.y+52
            );

        }

    }


    /*
        HARE RUNNING
    */

    if (
        hare.targetX !== undefined &&
        !hare.sleeping &&
        !hare.sitting &&
        !hare.lyingDown &&
        sceneIndex < 14
    ) {

        if (
            Math.abs(
                hare.targetX-hare.x
            ) > 2
        ) {

            const direction =
                hare.targetX >
                hare.x
                    ? 1
                    : -1;

            hare.x +=
                direction*
                .95*
                dt;

            hare.walkTimer +=
                dt;

            if (
                hare.walkTimer>5
            ) {

                hare.walkTimer=0;

                hare.walkFrame =
                    1-hare.walkFrame;

            }

            if (
                Math.random()<.06
            ) {

                spawnParticle(
                    hare.x+18,
                    hare.y+49
                );

            }

        }

    }


    /*
        HARE SITTING
    */

    if (
        hare.sitting
    ) {

        hare.y =
            402;

        hare.earMotion =
            Math.sin(
                performance.now()*.002
            );

    }


    /*
        HARE LYING DOWN
    */

    if (
        hare.lyingDown
    ) {

        hare.y =
            407 +
            Math.sin(
                performance.now()*.0025
            )*1.5;

    }


    /*
        SLEEP TRANSITION
    */

    if (
        sceneIndex === 17
    ) {

        hare.sleepProgress =
            Math.min(
                1,
                hare.sleepProgress+
                .008*dt
            );

    }


    /*
        VICTORY JUMP
    */

    if (
        sceneIndex === 26
    ) {

        skull.jump =
            Math.abs(
                Math.sin(
                    performance.now()*.005
                )
            )*62;

    }


    /*
        STRIKE ANIMATION
    */

    if (
        sceneIndex === 22
    ) {

        skull.swordAngle =
            -1.9;

    }


    if (
        sceneIndex === 23
    ) {

        skull.swordAngle =
            -2.5;

    }


    if (
        sceneIndex === 25
    ) {

        skull.swordAngle =
            .8;

    }

}


/* =========================================================
   CINEMATIC UPDATE
========================================================= */

function updateCinematic(dt) {

    if (
        flash > 0
    ) {

        flash -=
            .06*dt;

        if (
            flash<0
        ) {

            flash=0;

        }

    }

}


/* =========================================================
   DRAW FRAME
========================================================= */

function drawFrame() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    /*
        Camera zoom around screen center.
    */

    ctx.translate(
        480,
        300
    );

    ctx.scale(
        cameraZoom,
        cameraZoom
    );

    ctx.translate(
        -480,
        -300
    );

    drawWorld();

    drawSkull();

    drawHare();

    drawParticles();

    ctx.restore();


    /*
        Vignette
    */

    const vignette =
        ctx.createRadialGradient(
            480,
            300,
            150,
            480,
            300,
            560
        );

    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        "rgba(0,0,0,.76)"
    );

    ctx.fillStyle =
        vignette;

    ctx.fillRect(
        0,
        0,
        960,
        600
    );


    /*
        Cinematic bars
    */

    rect(
        0,
        0,
        960,
        22,
        "#020204"
    );

    rect(
        0,
        578,
        960,
        22,
        "#020204"
    );


    /*
        Strike flash
    */

    if (
        flash > 0
    ) {

        ctx.fillStyle =
            `rgba(255,255,255,${flash*.55})`;

        ctx.fillRect(
            0,
            0,
            960,
            600
        );

    }

}


/* =========================================================
   MAIN LOOP
========================================================= */

function gameLoop(time) {

    if (
        !lastTime
    ) {

        lastTime =
            time;

    }

    const dt =
        Math.min(
            (time-lastTime)/16.67,
            2
        );

    lastTime =
        time;


    if (
        started
    ) {

        sceneTime +=
            dt/60;

        updateCharacters(dt);

        updateCamera(dt);

        updateParticles(dt);

        updateCinematic(dt);


        if (
            sceneTime >=
            scenes[sceneIndex].duration
        ) {

            if (
                sceneIndex <
                scenes.length-1
            ) {

                startScene(
                    sceneIndex+1
                );

            } else {

                showMoral();

            }

        }

    }


    drawFrame();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   MORAL
========================================================= */

function showMoral() {

    if (
        moralShown
    ) {

        return;

    }

    moralShown =
        true;

    setTimeout(
        () => {

            moral.style.display =
                "flex";

        },
        1800
    );

}


/* =========================================================
   START
========================================================= */

function startGame() {

    if (
        started
    ) {

        return;

    }

    started =
        true;

    titleScreen.style.display =
        "none";

    startScene(0);

}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    location.reload();

}


/* =========================================================
   INPUT
========================================================= */

titleScreen.addEventListener(
    "click",
    startGame
);

moral.addEventListener(
    "click",
    restartGame
);


/* =========================================================
   INITIAL FRAME
========================================================= */

startScene(0);

requestAnimationFrame(
    gameLoop
);

</script>
